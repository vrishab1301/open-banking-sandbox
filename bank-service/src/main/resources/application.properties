spring.application.name=bank-service

# Where the bank's web server listens
server.port=8080

# How to reach the database (the Docker container)
spring.datasource.url=jdbc:postgresql://localhost:5432/bank
spring.datasource.username=bank
spring.datasource.password=bankpass

# Tables are created only by Flyway; Hibernate just checks they match
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
